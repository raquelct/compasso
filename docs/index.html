as de cores diferentes que tenham exatamente o mesmo comprimento.","Cada dupla registra os pares encontrados na folha do desafio (ex.: 1/2 = 2/4).","Circule pelas duplas fazendo a pergunta: por que essas frações são iguais?"],mat:"régua de frações recortada, folha do desafio"},{aula:1,fase:"Aula 1 · Fechamento",title:"Registro no caderno",min:5,color:"#7fa8ff",obj:"sistematizar as descobertas com desenho e escrita da fração.",como:["Peça que cada aluno desenhe 2 pares de frações equivalentes que descobriu.","Ao lado do desenho, devem escrever uma frase explicando a equivalência.","Retome as respostas da pizza da abertura e corrija coletivamente."],mat:"caderno"},{aula:2,fase:"Aula 2 · Retomada",title:"Quiz relâmpago",min:10,color:"#ffb27a",obj:"verificar o que ficou da aula anterior e ajustar o ritmo.",como:["Projete ou escreva 5 perguntas rápidas sobre a aula anterior.","Os alunos respondem levantando cartões A, B, C ou D.","Registre a quantidade de acertos por questão para comparar com o bilhete de saída."],mat:"cartões de resposta, quadro ou projetor"},{aula:2,fase:"Aula 2 · Exploração",title:"3 chocolates para 4 pessoas",min:15,color:"#ff6b81",obj:"compreender a fração como resultado de uma divisão (quociente).",como:["Apresente o problema: como dividir 3 barras de chocolate igualmente entre 4 pessoas?","Em grupos de 4, os alunos dividem 3 tiras de papel e verificam quanto cada um recebe.","Conduza a conclusão: cada pessoa recebe 3/4, e 3 ÷ 4 = 3/4.","Proponha mais 2 divisões para os grupos resolverem sozinhos."],mat:"tiras de papel (3 por grupo)"},{aula:2,fase:"Aula 2 · Aplicação",title:"A receita da turma",min:15,color:"#b48cf5",obj:"usar a fração como razão ao ampliar e reduzir uma receita.",como:["Mostre uma receita simples de bolo para 8 pessoas.","Peça que os grupos adaptem a receita para 4 e para 16 pessoas.","Discuta como a razão entre os ingredientes se mantém (ex.: 2 xícaras de farinha para 1 de açúcar)."],mat:"receita impressa por grupo"},{aula:2,fase
